<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0915;
            --bg-sidebar: rgba(18, 16, 38, 0.95);
            --bg-card: rgba(27, 24, 56, 0.95);
            --border-glow: rgba(138, 43, 226, 0.4);
            --accent-purple: #8a2be2;
            --accent-blue: #00d2ff;
            --text-main: #f0f2f8;
            --text-sub: #a0a5c0;
            --danger: #ff4757;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; user-select: none; }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                              radial-gradient(circle at 85% 80%, rgba(0, 210, 255, 0.15) 0%, transparent 40%);
            color: var(--text-main);
        }

        /* شاشة القفل */
        #lock-screen {
            position: fixed; inset: 0; background: rgba(10, 9, 21, 0.98);
            z-index: 9999; display: flex; justify-content: center; align-items: center;
        }
        #lock-screen.hidden { display: none; }
        .lock-box {
            background: var(--bg-card); border: 1px solid var(--border-glow);
            padding: 2.5rem; border-radius: 24px; text-align: center; width: 90%; max-width: 400px;
        }
        .lock-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--accent-blue); }
        .pin-input {
            width: 100%; padding: 12px; font-size: 1.5rem; letter-spacing: 12px;
            text-align: center; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: #fff; margin-bottom: 1rem; outline: none;
        }
        .lock-btn {
            width: 100%; padding: 12px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            color: white; font-size: 1.1rem; font-weight: 600; cursor: pointer;
        }

        /* التطبيق */
        .app-container { display: flex; width: 100vw; height: 100vh; }
        .app-container.hidden { display: none; }

        /* الشريط الجانبي */
        .sidebar {
            width: 280px; background: var(--bg-sidebar); border-left: 1px solid var(--border-glow);
            display: flex; flex-direction: column; padding: 1rem;
        }
        .new-chat-btn {
            background: rgba(138, 43, 226, 0.2); border: 1px solid var(--border-glow);
            color: var(--text-main); padding: 12px; border-radius: 12px;
            font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 1rem;
        }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            padding: 12px; border-radius: 10px; background: rgba(255,255,255,0.03);
            cursor: pointer; font-size: 0.9rem; display: flex; justify-content: space-between;
        }
        .history-item.active { background: rgba(138, 43, 226, 0.3); border: 1px solid var(--border-glow); }

        /* المساحة الرئيسية */
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        header {
            height: 65px; padding: 0 1.5rem; background: rgba(15, 13, 33, 0.8);
            border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;
        }
        .chat-title { font-size: 1.1rem; font-weight: 700; }
        .settings-btn { background: none; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }

        /* صندوق الرسائل */
        .chat-box {
            flex: 1; padding: 1.5rem; padding-bottom: 120px;
            overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;
        }
        .message {
            max-width: 80%; padding: 14px 18px; border-radius: 16px;
            font-size: 0.95rem; line-height: 1.6; user-select: text;
        }
        .message.user { align-self: flex-start; background: linear-gradient(135deg, var(--accent-purple), #4c1d95); color: #fff; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-end; background: var(--bg-card); border: 1px solid var(--border-glow); border-bottom-left-radius: 4px; }
        .message.error { align-self: center; background: rgba(255, 71, 87, 0.15); border: 1px solid var(--danger); color: #ff6b81; font-size: 0.85rem; }

        /* مكان الكتابة والميكروفون في النص */
        .input-container {
            width: 100%; display: flex; justify-content: center;
            padding: 1.5rem; position: absolute; bottom: 0; left: 0;
            background: linear-gradient(to top, rgba(10,9,21,0.95), transparent);
            pointer-events: none; /* عشان ميعطلش اللمس */
        }
        .input-area {
            display: flex; gap: 10px; align-items: center;
            width: 100%; max-width: 750px;
            background: var(--bg-card); padding: 12px 16px;
            border-radius: 20px; border: 1px solid var(--border-glow);
            pointer-events: auto; /* تفعيل الكتابة واللمس */
        }
        .input-area textarea {
            flex: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; padding: 12px 16px; color: #fff;
            resize: none; height: 48px; outline: none; font-size: 0.95rem;
        }
        .input-area textarea:focus { border-color: var(--accent-purple); }
        
        .icon-btn {
            width: 48px; height: 48px; border-radius: 12px; border: none;
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; flex-shrink: 0;
        }
        .mic-btn { background: rgba(255,255,255,0.1); color: #fff; }
        .mic-btn.listening { background: var(--danger); animation: pulse 1.5s infinite; }
        .send-btn { background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue)); color: #fff; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* النوافذ */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 100; display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--bg-card); padding: 2rem; border-radius: 20px;
            width: 90%; max-width: 400px; border: 1px solid var(--border-glow);
        }
        .modal h3 { color: var(--accent-blue); margin-bottom: 1rem; }
        .modal-input {
            width: 100%; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 12px; color: #fff; margin-bottom: 1rem; outline: none;
        }
        .save-btn {
            background: linear-gradient(90deg, var(--accent-purple), var(--accent-blue));
            border: none; color: white; padding: 12px; border-radius: 10px;
            width: 100%; cursor: pointer; font-weight: 600; font-size: 1rem;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .input-area { max-width: 95%; }
        }
    </style>
</head>
<body>

    <!-- شاشة القفل -->
    <div id="lock-screen">
        <div class="lock-box">
            <div class="lock-title">🔒 نظام الأمان</div>
            <input type="password" id="pin-input" class="pin-input" maxlength="5" placeholder="•••••" autofocus>
            <button class="lock-btn" id="unlock-btn">تأكيد الدخول</button>
        </div>
    </div>

    <!-- التطبيق -->
    <div class="app-container hidden" id="app">
        <aside class="sidebar">
            <button class="new-chat-btn" id="new-chat-btn">+ محادثة جديدة</button>
            <div class="history-list" id="history-list"></div>
        </aside>
        <main class="main-content">
            <header>
                <div class="chat-title" id="current-chat-title">محادثة جديدة</div>
                <button class="settings-btn" id="open-settings-btn">⚙️</button>
            </header>
            
            <div class="chat-box" id="chat-box"></div>

            <!-- مكان الكتابة في النص -->
            <div class="input-container">
                <div class="input-area">
                    <button class="icon-btn mic-btn" id="mic-btn" title="تحدث">🎤</button>
                    <textarea id="user-input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                    <button class="icon-btn send-btn" id="send-btn" title="إرسال">➤</button>
                </div>
            </div>
        </main>
    </div>

    <!-- الإعدادات -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3>⚙️ إعدادات الذكاء الاصطناعي</h3>
            <input type="password" id="api-key-input" class="modal-input" placeholder="الصق مفتاح Gemini API هنا...">
            <button class="save-btn" id="save-settings-btn">حفظ الإعدادات</button>
        </div>
    </div>

    <script>
        const PIN_CODE = "77777";
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let modelName = 'gemini-2.0-flash';
        let chats = JSON.parse(localStorage.getItem('app_chats')) || [];
        let currentChatId = null;
        let recognition = null;
        let isListening = false;

        // العناصر
        const lockScreen = document.getElementById('lock-screen');
        const app = document.getElementById('app');
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        // فتح التطبيق
        document.getElementById('unlock-btn').onclick = () => {
            if(document.getElementById('pin-input').value === PIN_CODE) {
                lockScreen.classList.add('hidden');
                app.classList.remove('hidden');
                if(!apiKey) document.getElementById('settings-modal').classList.add('active');
                if(chats.length === 0) { createNewChat(); } 
                else { loadChat(chats[0].id); renderHistory(); }
            } else { alert('رقم سري خاطئ!'); }
        };

        // الإعدادات
        document.getElementById('open-settings-btn').onclick = () => {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('settings-modal').classList.add('active');
        };
        document.getElementById('save-settings-btn').onclick = () => {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            document.getElementById('settings-modal').classList.remove('active');
        };

        // المحادثات
        function createNewChat() {
            const newChat = { id: 'chat_' + Date.now(), title: 'محادثة جديدة', messages: [] };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveToStorage();
            renderHistory();
            loadChat(currentChatId);
        }

        function loadChat(id) {
            currentChatId = id;
            const chat = chats.find(c => c.id === id);
            document.getElementById('current-chat-title').textContent = chat.title;
            chatBox.innerHTML = '';
            chat.messages.forEach(msg => appendMsg(msg.role, msg.content));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            chats.forEach(c => {
                const div = document.createElement('div');
                div.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
                div.innerHTML = `<span>${c.title}</span>`;
                div.onclick = () => loadChat(c.id);
                list.appendChild(div);
            });
        }

        function saveToStorage() { localStorage.setItem('app_chats', JSON.stringify(chats)); }

        document.getElementById('new-chat-btn').onclick = createNewChat;

        // الرسائل
        function appendMsg(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // إرسال الرسالة
        document.getElementById('send-btn').onclick = sendMessage;
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if(!text) return;
            if(!apiKey) { alert('يرجى إدخال مفتاح API أولاً من الإعدادات ⚙️'); return; }

            const chat = chats.find(c => c.id === currentChatId);
            if(chat.messages.length === 0) {
                chat.title = text.substring(0, 20);
                document.getElementById('current-chat-title').textContent = chat.title;
                renderHistory();
            }
            
            chat.messages.push({ role: 'user', content: text });
            appendMsg('user', text);
            userInput.value = '';
            saveToStorage();

            appendMsg('ai', 'جاري التفكير... ⏳');
            const loadingMsg = chatBox.lastChild;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: chat.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })) })
                });
                const data = await res.json();
                chatBox.removeChild(loadingMsg);
                
                if(data.error) throw new Error(data.error.message);
                
                const reply = data.candidates[0].content.parts[0].text;
                chat.messages.push({ role: 'model', content: reply });
                appendMsg('ai', reply);
                saveToStorage();
                speak(reply);
            } catch(e) {
                chatBox.removeChild(loadingMsg);
                appendMsg('error', 'خطأ: ' + e.message);
            }
        }

        // الصوت
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'ar-EG';
            recognition.onstart = () => { isListening = true; document.getElementById('mic-btn').classList.add('listening'); };
            recognition.onresult = (e) => { userInput.value += (userInput.value ? ' ' : '') + e.results[0][0].transcript; };
            recognition.onerror = () => { isListening = false; document.getElementById('mic-btn').classList.remove('listening'); };
            recognition.onend = () => { isListening = false; document.getElementById('mic-btn').classList.remove('listening'); };
        }

        document.getElementById('mic-btn').onclick = () => {
            if(!recognition) return alert('المتصفح لا يدعم الصوت');
            if(isListening) recognition.stop();
            else recognition.start();
        };

        function speak(text) {
            if(!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'ar-EG';
            window.speechSynthesis.speak(u);
        }
    </script>
</body>
</html>
