<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Personal Assistant</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, sans-serif; }
  body {
    min-height:100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow-x:hidden;
  }
  /* ===== شاشة القفل ===== */
  .lock-screen {
    position:fixed; inset:0;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    z-index:9999;
    transition: opacity 0.6s, transform 0.6s;
  }
  .lock-screen.hidden { opacity:0; transform:scale(1.1); pointer-events:none; }
  .lock-icon {
    font-size:70px; margin-bottom:20px;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { transform:scale(1); filter:drop-shadow(0 0 15px #7c3aed); }
    50% { transform:scale(1.1); filter:drop-shadow(0 0 30px #a855f7); }
  }
  .lock-screen h2 { margin-bottom:25px; font-weight:400; color:#c4b5fd; }
  .pin-input {
    width:240px; padding:18px; text-align:center;
    font-size:28px; letter-spacing:12px;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(168,85,247,0.4);
    border-radius:16px; color:#fff; outline:none;
    transition:0.3s;
  }
  .pin-input:focus {
    border-color:#a855f7;
    box-shadow:0 0 25px rgba(168,85,247,0.6);
  }
  .unlock-btn {
    margin-top:20px; padding:14px 50px;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    border:none; border-radius:14px; color:#fff;
    font-size:17px; cursor:pointer; transition:0.3s;
    font-weight:600;
  }
  .unlock-btn:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(236,72,153,0.5); }
  .error-msg { color:#f87171; margin-top:15px; font-size:14px; height:20px; }
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform:translateX(0); }
    25% { transform:translateX(-12px); }
    75% { transform:translateX(12px); }
  }

  /* ===== التطبيق الرئيسي ===== */
  .app {
    width:100%; max-width:1100px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(20px);
    border-radius:24px;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 25px 60px rgba(0,0,0,0.5);
    overflow:hidden;
    display:none;
    flex-direction:column;
    height:88vh;
  }
  .app.show { display:flex; }

  .header {
    padding:20px 28px;
    background:linear-gradient(90deg, rgba(124,58,237,0.3), rgba(236,72,153,0.2));
    border-bottom:1px solid rgba(255,255,255,0.1);
    display:flex; justify-content:space-between; align-items:center;
  }
  .header h1 { font-size:20px; display:flex; align-items:center; gap:10px; }
  .status { font-size:13px; color:#4ade80; display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; background:#4ade80; border-radius:50%; animation:blink 1.5s infinite; }
  @keyframes blink { 50%{opacity:0.3;} }

  .tabs {
    display:flex; gap:8px; padding:15px 28px 0;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .tab {
    padding:12px 22px; cursor:pointer;
    background:transparent; border:none;
    color:#a78bfa; font-size:15px; font-weight:600;
    border-bottom:3px solid transparent;
    transition:0.3s;
  }
  .tab.active { color:#fff; border-bottom-color:#a855f7; }
  .tab:hover { color:#fff; }

  .content { flex:1; overflow-y:auto; padding:25px 28px; display:none; }
  .content.active { display:block; }
  .content::-webkit-scrollbar { width:6px; }
  .content::-webkit-scrollbar-thumb { background:#7c3aed; border-radius:3px; }

  /* ===== صفحة البحث ===== */
  .search-box { display:flex; gap:10px; margin-bottom:20px; }
  .search-box input {
    flex:1; padding:15px 20px; font-size:16px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(168,85,247,0.3);
    border-radius:14px; color:#fff; outline:none;
    transition:0.3s;
  }
  .search-box input:focus { border-color:#a855f7; box-shadow:0 0 20px rgba(168,85,247,0.4); }
  .btn-primary {
    padding:15px 28px; border:none; border-radius:14px;
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    color:#fff; font-size:15px; cursor:pointer; font-weight:600;
    transition:0.3s;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(236,72,153,0.5); }

  .result-card {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    border-right:4px solid #a855f7;
    padding:18px 20px; border-radius:14px; margin-bottom:12px;
    transition:0.3s;
  }
  .result-card:hover {
    background:rgba(255,255,255,0.1);
    transform:translateX(-5px);
  }
  .result-card .question { color:#c4b5fd; font-weight:600; margin-bottom:8px; font-size:15px; }
  .result-card .answer { color:#e5e7eb; line-height:1.7; font-size:15px; }
  .empty-state { text-align:center; color:#9ca3af; padding:50px 20px; font-size:15px; }

  /* ===== صفحة التخزين ===== */
  .form-group { margin-bottom:18px; }
  .form-group label { display:block; margin-bottom:8px; color:#c4b5fd; font-size:14px; font-weight:600; }
  .form-group input, .form-group textarea {
    width:100%; padding:14px 18px;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(168,85,247,0.3);
    border-radius:12px; color:#fff; outline:none;
    font-size:15px; font-family:inherit; transition:0.3s;
  }
  .form-group input:focus, .form-group textarea:focus {
    border-color:#a855f7; box-shadow:0 0 20px rgba(168,85,247,0.4);
  }
  .form-group textarea { resize:vertical; min-height:100px; }
  .memory-item {
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);
    padding:15px 18px; border-radius:12px; margin-bottom:10px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
  }
  .memory-item .info { flex:1; }
  .memory-item .q { color:#c4b5fd; font-weight:600; font-size:14px; margin-bottom:5px; }
  .memory-item .a { color:#e5e7eb; font-size:14px; line-height:1.6; }
  .delete-btn {
    background:rgba(239,68,68,0.2); border:1px solid rgba(239,68,68,0.4);
    color:#f87171; padding:8px 14px; border-radius:10px;
    cursor:pointer; font-size:13px; transition:0.3s;
    flex-shrink:0;
  }
  .delete-btn:hover { background:rgba(239,68,68,0.4); }

  .toast {
    position:fixed; bottom:30px; left:50%;
    transform:translateX(-50%) translateY(100px);
    background:linear-gradient(135deg,#7c3aed,#ec4899);
    padding:14px 30px; border-radius:14px;
    color:#fff; font-weight:600; z-index:10000;
    transition:0.4s; opacity:0;
  }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  @media (max-width:600px) {
    .app { height:95vh; border-radius:18px; }
    .header h1 { font-size:16px; }
    .tab { padding:10px 14px; font-size:13px; }
    .content { padding:18px; }
    .search-box { flex-direction:column; }
  }
</style>
</head>
<body>

<!-- شاشة القفل -->
<div class="lock-screen" id="lockScreen">
  <div class="lock-icon">🔒</div>
  <h2>أدخل الرقم السري للمتابعة</h2>
  <input type="password" class="pin-input" id="pinInput" maxlength="5" placeholder="•••••" inputmode="numeric">
  <button class="unlock-btn" onclick="unlock()">دخول</button>
  <div class="error-msg" id="errorMsg"></div>
</div>

<!-- التطبيق -->
<div class="app" id="app">
  <div class="header">
    <h1>🤖 مساعدي الذكي</h1>
    <div class="status"><span class="dot"></span> متصل</div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('search', this)">🔍 البحث</button>
    <button class="tab" onclick="switchTab('memory', this)">💾 التخزين</button>
  </div>

  <!-- صفحة البحث -->
  <div class="content active" id="searchPage">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="اسأل عن أي معلومة خزنتها..." onkeypress="if(event.key==='Enter') doSearch()">
      <button class="btn-primary" onclick="doSearch()">بحث</button>
    </div>
    <div id="searchResults">
      <div class="empty-state">💡 ابدأ بالبحث عن أي معلومة قمت بتخزينها</div>
    </div>
  </div>

  <!-- صفحة التخزين -->
  <div class="content" id="memoryPage">
    <div class="form-group">
      <label>السؤال / المعلومة</label>
      <input type="text" id="qInput" placeholder="مثال: ما هو رقم حسابي البنكي؟">
    </div>
    <div class="form-group">
      <label>الإجابة / التفاصيل</label>
      <textarea id="aInput" placeholder="اكتب الإجابة أو التفاصيل هنا..."></textarea>
    </div>
    <button class="btn-primary" onclick="saveMemory()" style="width:100%;margin-bottom:25px;">💾 حفظ في الذاكرة</button>
    <h3 style="color:#c4b5fd;margin-bottom:15px;font-size:16px;">📚 المعلومات المخزنة</h3>
    <div id="memoryList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
/* ========== إعداداتك ========== */
const SECRET_PIN = "77777";
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
/* ============================== */

let db = null;
let firebaseReady = false;
let localMemories = []; // نسخة احتياطية لو Firebase مش متظبط

// ===== تهيئة Firebase =====
try {
  if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    firebaseReady = true;
    console.log("✅ Firebase متصل");
  } else {
    console.warn("⚠️ Firebase مش متظبط - هيستخدم التخزين المحلي");
  }
} catch(e) {
  console.warn("⚠️ خطأ في Firebase:", e.message);
}

// تحميل من التخزين المحلي كاحتياطي
const saved = localStorage.getItem('ai_memories');
if (saved) localMemories = JSON.parse(saved);

/* ========== شاشة القفل ========== */
let attempts = 0;
function unlock() {
  const input = document.getElementById('pinInput');
  const err = document.getElementById('errorMsg');
  if (input.value === SECRET_PIN) {
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('app').classList.add('show');
    loadMemories();
  } else {
    attempts++;
    err.textContent = `❌ رقم سري خاطئ (محاولة ${attempts})`;
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 400);
    input.value = '';
    if (attempts >= 3) {
      err.textContent = "🔒 تم إغلاق الصفحة مؤقتاً...";
      input.disabled = true;
      setTimeout(() => {
        input.disabled = false;
        attempts = 0;
        err.textContent = "";
      }, 5000);
    }
  }
}
document.getElementById('pinInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') unlock();
});

/* ========== التبويبات ========== */
function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(name + 'Page').classList.add('active');
  if (name === 'memory') loadMemories();
}

/* ========== حفظ الذاكرة ========== */
async function saveMemory() {
  const q = document.getElementById('qInput').value.trim();
  const a = document.getElementById('aInput').value.trim();
  if (!q || !a) { showToast('⚠️ املأ السؤال والإجابة'); return; }

  const item = { question: q, answer: a, createdAt: Date.now() };

  if (firebaseReady && db) {
    try {
      await db.collection('memories').add(item);
      showToast('✅ تم الحفظ في السحابة');
    } catch(e) {
      showToast('⚠️ خطأ Firebase - تم الحفظ محلياً');
      localMemories.push(item);
      localStorage.setItem('ai_memories', JSON.stringify(localMemories));
    }
  } else {
    localMemories.push(item);
    localStorage.setItem('ai_memories', JSON.stringify(localMemories));
    showToast('✅ تم الحفظ في الذاكرة المحلية');
  }

  document.getElementById('qInput').value = '';
  document.getElementById('aInput').value = '';
  loadMemories();
}

/* ========== تحميل الذاكرة ========== */
async function loadMemories() {
  const list = document.getElementById('memoryList');
  list.innerHTML = '<div class="empty-state">جاري التحميل...</div>';
  let items = [];

  if (firebaseReady && db) {
    try {
      const snap = await db.collection('memories').orderBy('createdAt', 'desc').get();
      snap.forEach(doc => items.push({ id: doc.id, ...doc.data(), _source: 'cloud' }));
    } catch(e) {
      items = localMemories.map((m,i) => ({ ...m, id: 'local_'+i, _source: 'local' }));
    }
  } else {
    items = localMemories.map((m,i) => ({ ...m, id: 'local_'+i, _source: 'local' }));
  }

  window._allMemories = items;

  if (items.length === 0) {
    list.innerHTML = '<div class="empty-state">📭 لا توجد معلومات مخزنة بعد</div>';
    return;
  }

  list.innerHTML = items.map(item => `
    <div class="memory-item">
      <div class="info">
        <div class="q">❓ ${escapeHtml(item.question)}</div>
        <div class="a">💡 ${escapeHtml(item.answer)}</div>
      </div>
      <button class="delete-btn" onclick="deleteMemory('${item.id}', '${item._source}')">🗑️</button>
    </div>
  `).join('');
}

/* ========== البحث الذكي ========== */
function doSearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');

  if (!query) {
    results.innerHTML = '<div class="empty-state">✍️ اكتب كلمة للبحث</div>';
    return;
  }

  const items = window._allMemories || [];
  if (items.length === 0) {
    results.innerHTML = '<div class="empty-state">📭 لا توجد معلومات مخزنة بعد. أضف معلومات أولاً من تبويب التخزين</div>';
    return;
  }

  // بحث بسيط ذكي - يطابق الكلمات في السؤال والإجابة
  const keywords = query.split(/\s+/).filter(k => k.length > 0);
  const matches = items.filter(item => {
    const text = (item.question + ' ' + item.answer).toLowerCase();
    return keywords.some(k => text.includes(k));
  });

  if (matches.length === 0) {
    results.innerHTML = `<div class="empty-state">🔍 لا نتائج لـ "${escapeHtml(query)}"<br><small style="color:#6b7280">جرب كلمات أخرى</small></div>`;
    return;
  }

  // ترتيب حسب درجة المطابقة
  matches.sort((a, b) => {
    const scoreA = keywords.filter(k => (a.question + ' ' + a.answer).toLowerCase().includes(k)).length;
    const scoreB = keywords.filter(k => (b.question + ' ' + b.answer).toLowerCase().includes(k)).length;
    return scoreB - scoreA;
  });

  results.innerHTML = `<div style="color:#a78bfa;margin-bottom:15px;font-size:14px;">🔎 وجدت ${matches.length} نتيجة</div>` +
    matches.map(item => `
      <div class="result-card">
        <div class="question">❓ ${escapeHtml(item.question)}</div>
        <div class="answer">💡 ${escapeHtml(item.answer)}</div>
      </div>
    `).join('');
}

/* ========== حذف ========== */
async function deleteMemory(id, source) {
  if (!confirm('هل أنت متأكد من حذف هذه المعلومة؟')) return;

  if (source === 'cloud' && firebaseReady && db) {
    try { await db.collection('memories').doc(id).delete(); }
    catch(e) { showToast('⚠️ خطأ في الحذف'); return; }
  } else {
    const idx = parseInt(id.split('_')[1]);
    localMemories.splice(idx, 1);
    localStorage.setItem('ai_memories', JSON.stringify(localMemories));
  }
  showToast('🗑️ تم الحذف');
  loadMemories();
}

/* ========== أدوات مساعدة ========== */
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, s => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[s]));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>

</body>
</html>
