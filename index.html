<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مساعد الذكاء الاصطناعي - النسخة المطورة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-surface: #1e293b;
            --bg-card: #334155;
            --accent-color: #0ea5e9;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --user-msg: #0284c7;
            --ai-msg: #1e293b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

        html, body {
            width: 100%; height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #lock-screen {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.98);
            z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #lock-screen.hidden { display: none; }
        .lock-box {
            background: var(--bg-surface); border: 2px solid var(--accent-color);
            padding: 2.5rem; border-radius: 20px; text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.2);
        }
        .pin-input {
            width: 100%; padding: 12px; font-size: 1.5rem; letter-spacing: 12px; text-align: center;
            background: #0f172a; border: 1px solid var(--text-sub); border-radius: 10px; color: #fff; margin-bottom: 1rem; outline: none;
        }
        .lock-btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            background: var(--accent-color); color: white; font-size: 1.1rem; font-weight: 700; cursor: pointer;
        }

        .app-container { display: flex; width: 100%; height: 100%; overflow: hidden; position: relative; }

        .sidebar {
            width: 280px; background: var(--bg-surface); border-left: 1px solid #334155;
            display: flex; flex-direction: column; padding: 1rem; height: 100%; flex-shrink: 0; z-index: 10;
        }
        .new-chat-btn {
            background: var(--accent-color); border: none; color: white;
            padding: 12px; border-radius: 10px; cursor: pointer; margin-bottom: 1rem; font-weight: 700;
        }
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .history-item {
            padding: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); cursor: pointer;
            font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-sub);
        }
        .history-item.active { background: var(--accent-color); color: #fff; }

        .main-content {
            flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; background: #0f172a; overflow: hidden;
        }

        header {
            height: 65px; padding: 0 1.5rem; border-bottom: 1px solid #334155;
            display: flex; justify-content: space-between; align-items: center; background: var(--bg-surface); flex-shrink: 0;
        }
        .chat-title-wrapper { display: flex; flex-direction: column; }
        .chat-title { font-size: 1rem; font-weight: 700; color: #fff; }
        .version-tag { font-size: 0.75rem; color: #38bdf8; font-weight: 600; }
        
        .header-actions { display: flex; gap: 10px; }
        .icon-btn { background: #334155; border: none; color: #fff; width: 35px; height: 35px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1rem; }

        .input-area {
            width: 100%;
            padding: 12px 1.5rem; background: var(--bg-surface);
            border-bottom: 1px solid #334155; display: flex; gap: 10px; align-items: center; flex-shrink: 0; z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .input-box-wrapper { flex: 1; display: flex; align-items: center; }
        textarea {
            width: 100%; background: #0f172a; border: 1px solid #475569;
            border-radius: 10px; padding: 10px 14px; color: #fff; resize: none; height: 45px; outline: none; font-size: 0.95rem;
        }
        .send-btn, .mic-btn {
            width: 45px; height: 45px; border-radius: 10px; border: none;
            background: var(--accent-color); color: white; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; flex-shrink: 0;
        }
        .mic-btn { background: #334155; }

        .chat-box {
            flex: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; scroll-behavior: smooth;
        }
        .message {
            max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 0.95rem; word-break: break-word; position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
        }
        .message.user { align-self: flex-start; background: var(--user-msg); color: #fff; }
        .message.ai { align-self: flex-end; background: var(--ai-msg); border: 1px solid #475569; color: #f8fafc; }
        .message.error-msg { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--danger); color: #fca5a5; align-self: center; max-width: 90%; }
        
        .delete-msg-btn {
            background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.9rem; padding: 0 4px;
        }
        .delete-msg-btn:hover { color: var(--danger); }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--bg-surface); padding: 1.8rem; border-radius: 16px; width: 90%; max-width: 450px; border: 1px solid #475569; }
        .modal-input {
            width: 100%; background: #0f172a; border: 1px solid #475569;
            border-radius: 8px; padding: 10px; color: #fff; margin-bottom: 1rem; outline: none;
        }
        textarea.modal-input { resize: vertical; height: 80px; }
        .save-btn {
            width: 100%; background: var(--accent-color);
            border: none; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 700;
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-box">
            <h2 style="color:#38bdf8; margin-bottom:0.5rem;">نظام الأمان</h2>
            <p style="color:var(--text-sub); margin-bottom:1.5rem;">أدخل رمز PIN (77777)</p>
            <input type="password" id="pin-input" class="pin-input" maxlength="5" placeholder="•••••" autofocus>
            <button class="lock-btn" id="unlock-btn">دخول</button>
        </div>
    </div>

    <div class="app-container">
        <aside class="sidebar">
            <button class="new-chat-btn" id="new-chat-btn">+ محادثة جديدة</button>
            <div class="history-list" id="history-list"></div>
        </aside>

        <main class="main-content">
            <header>
                <div class="chat-title-wrapper">
                    <div class="chat-title" id="current-chat-title">محادثة جديدة</div>
                    <span class="version-tag">إصدار فحص التحديث: v4.0 (محدث)</span>
                </div>
                <div class="header-actions">
                    <button class="icon-btn" id="open-rules-btn" title="قواعد النموذج">📌</button>
                    <button class="icon-btn" id="open-settings-btn" title="الإعدادات">⚙️</button>
                </div>
            </header>

            <div class="input-area">
                <button class="mic-btn" id="mic-btn" title="تحدث">🎤</button>
                <div class="input-box-wrapper">
                    <textarea id="user-input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                </div>
                <button class="send-btn" id="send-btn" title="إرسال">➤</button>
            </div>

            <div class="chat-box" id="chat-box"></div>
        </main>
    </div>

    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3 style="margin-bottom: 1rem; color:#38bdf8;">إعدادات المفتاح (API Key)</h3>
            <input type="password" id="api-key-input" class="modal-input" placeholder="ألصق المفتاح هنا...">
            <button class="save-btn" id="save-settings-btn">حفظ الإعدادات</button>
        </div>
    </div>

    <div class="modal-overlay" id="rules-modal">
        <div class="modal">
            <h3 style="margin-bottom: 1rem; color:#38bdf8;">قواعد ومعلومات النموذج</h3>
            <textarea id="system-rules-input" class="modal-input" placeholder="اكتب التعليمات هنا..."></textarea>
            <button class="save-btn" id="save-rules-btn">حفظ القواعد</button>
        </div>
    </div>

    <script>
        const PIN_CODE = "77777";
        let apiKey = localStorage.getItem('gemini_api_key') || '';
        let systemRules = localStorage.getItem('gemini_system_rules') || 'أنت مساعد ذكي ومحرك قصص، ورد دائماً باللهجة المصرية العامية.';
        let modelName = 'gemini-1.5-flash';
        let chats = JSON.parse(localStorage.getItem('app_chats')) || [];
        let currentChatId = null;

        document.getElementById('unlock-btn').onclick = () => {
            if(document.getElementById('pin-input').value === PIN_CODE) {
                document.getElementById('lock-screen').classList.add('hidden');
                if(!apiKey) document.getElementById('settings-modal').classList.add('active');
                if(chats.length === 0) {
                    const newId = 'chat_' + Date.now();
                    chats.push({id: newId, title: 'محادثة جديدة', messages: []});
                    currentChatId = newId;
                } else {
                    currentChatId = chats[0].id;
                }
                renderHistory();
                loadChat();
            } else {
                alert('رمز PIN خطأ، الرمز هو 77777');
            }
        };

        document.getElementById('open-settings-btn').onclick = () => {
            document.getElementById('api-key-input').value = apiKey;
            document.getElementById('settings-modal').classList.add('active');
        };

        document.getElementById('save-settings-btn').onclick = () => {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('gemini_api_key', apiKey);
            document.getElementById('settings-modal').classList.remove('active');
            alert('تم حفظ المفتاح بنجاح!');
        };

        document.getElementById('open-rules-btn').onclick = () => {
            document.getElementById('system-rules-input').value = systemRules;
            document.getElementById('rules-modal').classList.add('active');
        };

        document.getElementById('save-rules-btn').onclick = () => {
            systemRules = document.getElementById('system-rules-input').value.trim();
            localStorage.setItem('gemini_system_rules', systemRules);
            document.getElementById('rules-modal').classList.remove('active');
            alert('تم حفظ القواعد بنجاح!');
        };

        function renderHistory() {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.textContent = chat.title;
                div.onclick = () => {
                    currentChatId = chat.id;
                    loadChat();
                    renderHistory();
                };
                list.appendChild(div);
            });
        }

        function loadChat() {
            const chat = chats.find(c => c.id === currentChatId);
            if(!chat) return;
            document.getElementById('current-chat-title').textContent = chat.title;
            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            chat.messages.forEach((msg, index) => {
                box.innerHTML += `
                    <div class="message ${msg.role}">
                        <span>${msg.content}</span>
                        <button class="delete-msg-btn" onclick="window.deleteMessage(${index})" title="حذف الرسالة">🗑️</button>
                    </div>`;
            });
            box.scrollTop = 0;
        }

        window.deleteMessage = function(index) {
            const chat = chats.find(c => c.id === currentChatId);
            if(!chat) return;
            chat.messages.splice(index, 1);
            localStorage.setItem('app_chats', JSON.stringify(chats));
            loadChat();
        };

        document.getElementById('new-chat-btn').onclick = () => {
            const newId = 'chat_' + Date.now();
            chats.unshift({id: newId, title: 'محادثة جديدة', messages: []});
            currentChatId = newId;
            renderHistory();
            loadChat();
        };

        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('user-input').onkeypress = (e) => {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        };

        async function sendMessage() {
            const text = document.getElementById('user-input').value.trim();
            if(!text) return;
            if(!apiKey) {
                alert('يرجى إدخال مفتاح API من الإعدادات أولاً.');
                document.getElementById('settings-modal').classList.add('active');
                return;
            }

            const chat = chats.find(c => c.id === currentChatId);
            if(!chat) return;

            if(chat.messages.length === 0) {
                chat.title = text.length > 15 ? text.substring(0, 15) + '...' : text;
                renderHistory();
            }

            chat.messages.push({role: 'user', content: text});
            localStorage.setItem('app_chats', JSON.stringify(chats));
            loadChat();
            document.getElementById('user-input').value = '';
            
            const box = document.getElementById('chat-box');
            const loadingId = 'load_' + Date.now();
            box.innerHTML += `<div class="message ai" id="${loadingId}"><span>جاري التفكير والكتابة...</span></div>`;
            box.scrollTop = 0;

            try {
                const requestBody = {
                    contents: [
                        {
                            parts: [
                                { text: systemRules + "\n\nسؤال المستخدم: " + text }
                            ]
                        }
                    ]
                };

                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await res.json();
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();

                if(!res.ok || data.error) {
                    throw new Error(data.error?.message || `خطأ في الاتصال (كود: ${res.status})`);
                }

                const reply = data.candidates[0].content.parts[0].text;

                chat.messages.push({role: 'ai', content: reply});
                localStorage.setItem('app_chats', JSON.stringify(chats));
                loadChat();
            } catch(e) {
                const loadingEl = document.getElementById(loadingId);
                if(loadingEl) loadingEl.remove();
                
                box.innerHTML += `<div class="message error-msg"><span>❌ خطأ: ${e.message}</span></div>`;
                box.scrollTop = 0;
            }
        }
    </script>
</body>
</html>
