<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مساعدي الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0915;color:#f0f2f8}
#lock-screen{position:fixed;inset:0;background:#0a0915;z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center}
#lock-screen.hidden{display:none}
.lock-box{background:#1b1838;border:1px solid #8a2be2;padding:2rem;border-radius:20px;text-align:center;width:90%;max-width:350px}
.lock-title{font-size:1.5rem;font-weight:700;margin-bottom:1rem;color:#00d2ff}
.pin-input{width:100%;padding:12px;font-size:1.5rem;letter-spacing:10px;text-align:center;background:#000;border:1px solid #333;border-radius:10px;color:#fff;margin-bottom:1rem;outline:none}
.lock-btn{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(90deg,#8a2be2,#00d2ff);color:white;font-size:1.1rem;cursor:pointer;font-weight:bold}
.app-container{display:none;width:100vw;height:100vh}
.app-container.active{display:flex}
.sidebar{width:260px;background:#121026;border-left:1px solid #8a2be2;display:flex;flex-direction:column;padding:1rem}
.new-chat-btn{background:rgba(138,43,226,0.3);border:1px solid #8a2be2;color:white;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:1rem;font-weight:bold}
.history-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:5px}
.history-item{padding:10px;border-radius:8px;background:rgba(255,255,255,0.05);cursor:pointer;display:flex;justify-content:space-between;font-size:0.9rem}
.history-item.active{background:rgba(138,43,226,0.3);border:1px solid #8a2be2}
.main-content{flex:1;display:flex;flex-direction:column;height:100vh;position:relative}
header{height:60px;padding:0 1rem;border-bottom:1px solid rgba(255,255,255,0.1);display:flex;justify-content:space-between;align-items:center;background:rgba(15,13,33,0.6)}
/* صندوق الكتابة فوق */
.input-container{width:100%;display:flex;justify-content:center;padding:1rem;background:rgba(10,9,21,0.95);border-bottom:1px solid rgba(255,255,255,0.1);z-index:5}
.input-area{display:flex;gap:8px;align-items:center;width:100%;max-width:700px;background:rgba(20,18,40,0.95);padding:10px;border-radius:16px;border:1px solid #8a2be2}
textarea{flex:1;background:rgba(0,0,0,0.4);border:none;border-radius:10px;padding:10px;color:#fff;resize:none;height:45px;outline:none;font-size:0.95rem}
.send-btn,.mic-btn{width:45px;height:45px;border-radius:10px;border:none;background:linear-gradient(135deg,#8a2be2,#00d2ff);color:white;font-size:1.2rem;cursor:pointer;display:flex;justify-content:center;align-items:center;flex-shrink:0}
.mic-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2)}
.mic-btn.listening{background:#ff4757;animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,71,87,0.7)}70%{box-shadow:0 0 0 10px rgba(255,71,87,0)}}
.chat-box{flex:1;padding:1rem;overflow-y:auto;display:flex;flex-direction:column;gap:1rem}
.message{max-width:80%;padding:12px 16px;border-radius:12px;font-size:0.95rem;line-height:1.5;user-select:text}
.message.user{align-self:flex-start;background:linear-gradient(135deg,#8a2be2,#4c1d95);color:#fff}
.message.ai{align-self:flex-end;background:rgba(20,24,45,0.9);border:1px solid rgba(0,210,255,0.2)}
.message.error{align-self:center;background:rgba(255,71,87,0.2);color:#ff4757;border:1px solid #ff4757;font-size:0.85rem}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:100;display:none;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#1b1838;padding:1.5rem;border-radius:16px;width:90%;max-width:400px;border:1px solid #8a2be2}
.modal-input{width:100%;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;color:#fff;margin-bottom:1rem;outline:none}
.save-btn{background:linear-gradient(90deg,#8a2be2,#00d2ff);border:none;color:white;padding:10px;border-radius:8px;width:100%;cursor:pointer;font-weight:bold}
@media(max-width:768px){.sidebar{display:none}}
</style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <div class="lock-title">نظام الأمان</div>
        <input type="password" id="pin-input" class="pin-input" maxlength="5" placeholder="•••••" autofocus>
        <button class="lock-btn" id="unlock-btn">دخول</button>
    </div>
</div>

<div class="app-container" id="app">
    <aside class="sidebar">
        <button class="new-chat-btn" id="new-chat-btn">+ محادثة جديدة</button>
        <div class="history-list" id="history-list"></div>
    </aside>
    <main class="main-content">
        <header>
            <div class="chat-title" id="current-chat-title">محادثة جديدة</div>
            <div><button class="new-chat-btn" id="open-settings-btn" style="margin:0;padding:5px 10px">⚙️</button></div>
        </header>
        
        <div class="input-container">
            <div class="input-area">
                <button class="mic-btn" id="mic-btn">🎤</button>
                <textarea id="user-input" placeholder="اكتب رسالتك هنا..." rows="1"></textarea>
                <button class="send-btn" id="send-btn">➤</button>
            </div>
        </div>

        <div class="chat-box" id="chat-box"></div>
    </main>
</div>

<div class="modal-overlay" id="settings-modal">
    <div class="modal">
        <h3 style="margin-bottom:1rem;color:#00d2ff">⚙️ الإعدادات</h3>
        <input type="password" id="api-key-input" class="modal-input" placeholder="مفتاح Gemini API (AIzaSy...)">
        <button class="save-btn" id="save-settings-btn">حفظ وإغلاق</button>
    </div>
</div>

<script>
const PIN_CODE = "77777";
let apiKey = localStorage.getItem('gemini_api_key') || '';
let modelName = 'gemini-2.0-flash';
let chats = JSON.parse(localStorage.getItem('app_chats')) || [];
let currentChatId = null;
let recognition = null;

document.getElementById('unlock-btn').onclick = () => {
    if(document.getElementById('pin-input').value === PIN_CODE) {
        document.getElementById('lock-screen').classList.add('hidden');
        document.getElementById('app').classList.add('active');
        if(!apiKey) document.getElementById('settings-modal').classList.add('active');
        if(chats.length === 0) createNewChat(); else { loadChat(chats[0].id); renderHistory(); }
    } else alert('رقم سري خاطئ!');
};

document.getElementById('save-settings-btn').onclick = () => {
    apiKey = document.getElementById('api-key-input').value.trim();
    localStorage.setItem('gemini_api_key', apiKey);
    document.getElementById('settings-modal').classList.remove('active');
};

document.getElementById('open-settings-btn').onclick = () => {
    document.getElementById('api-key-input').value = apiKey;
    document.getElementById('settings-modal').classList.add('active');
};

function createNewChat() {
    const newChat = { id: 'chat_' + Date.now(), title: 'محادثة جديدة', messages: [] };
    chats.unshift(newChat); currentChatId = newChat.id;
    saveToStorage(); renderHistory(); loadChat(currentChatId);
}

function loadChat(id) {
    currentChatId = id;
    const chat = chats.find(c => c.id === id);
    document.getElementById('current-chat-title').textContent = chat.title;
    document.getElementById('chat-box').innerHTML = '';
    chat.messages.forEach(msg => appendMsg(msg.role, msg.content));
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('history-list');
    list.innerHTML = '';
    chats.forEach(c => {
        const div = document.createElement('div');
        div.className = `history-item ${c.id === currentChatId ? 'active' : ''}`;
        div.innerHTML = `<span>${c.title}</span>`;
        div.onclick = () => loadChat(c.id);
        list.appendChild(div);
    });
}

function saveToStorage() { localStorage.setItem('app_chats', JSON.stringify(chats)); }
document.getElementById('new-chat-btn').onclick = createNewChat;

function appendMsg(role, text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    div.textContent = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

document.getElementById('send-btn').onclick = async () => {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if(!text || !apiKey) return;
    
    const chat = chats.find(c => c.id === currentChatId);
    if(chat.messages.length === 0) {
        chat.title = text.substring(0, 20);
        document.getElementById('current-chat-title').textContent = chat.title;
        renderHistory();
    }
    
    chat.messages.push({ role: 'user', content: text });
    appendMsg('user', text);
    input.value = ''; saveToStorage();

    appendMsg('ai', 'جاري التفكير...');
    const loadingMsg = document.getElementById('chat-box').lastChild;

    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: chat.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'model', parts: [{ text: m.content }] })) })
        });
        const data = await res.json();
        document.getElementById('chat-box').removeChild(loadingMsg);
        if(data.error) throw new Error(data.error.message);
        
        const reply = data.candidates[0].content.parts[0].text;
        chat.messages.push({ role: 'model', content: reply });
        appendMsg('ai', reply);
        saveToStorage(); speak(reply);
    } catch(e) {
        document.getElementById('chat-box').removeChild(loadingMsg);
        appendMsg('error', 'خطأ: ' + e.message);
    }
};

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ar-EG';
    recognition.onstart = () => document.getElementById('mic-btn').classList.add('listening');
    recognition.onresult = (e) => { document.getElementById('user-input').value += e.results[0][0].transcript; };
    recognition.onend = () => document.getElementById('mic-btn').classList.remove('listening');
}

document.getElementById('mic-btn').onclick = () => {
    if(!recognition) return alert('المتصفح لا يدعم الصوت');
    if(document.getElementById('mic-btn').classList.contains('listening')) recognition.stop();
    else recognition.start();
};

function speak(text) {
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ar-EG';
    window.speechSynthesis.speak(u);
}
</script>
</body>
</html>
