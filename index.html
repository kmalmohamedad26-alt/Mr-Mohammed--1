<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المساعد القصصي الذكي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo', sans-serif; }
  body { min-height:100vh; background: linear-gradient(135deg, #0a0a16, #1a103c, #0d0d1a); color:#e2e8f0; display:flex; justify-content:center; align-items:center; padding:15px; overflow:hidden; }
  
  .lock-screen { position:fixed; inset:0; background: radial-gradient(circle at center, #1a103c, #0a0a16); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:9999; transition:opacity 0.8s ease; }
  .lock-screen.hidden { opacity:0; pointer-events:none; }
  .lock-icon { font-size:60px; margin-bottom:20px; animation:pulse 2.5s infinite; }
  @keyframes pulse { 0%,100% { transform:scale(1); filter:drop-shadow(0 0 15px #8b5cf6); } 50% { transform:scale(1.08); filter:drop-shadow(0 0 35px #d946ef); } }
  .lock-screen h2 { margin-bottom:25px; font-weight:600; color:#c4b5fd; font-size:18px; }
  .pin-input { width:200px; padding:15px; text-align:center; font-size:24px; letter-spacing:10px; background:rgba(255,255,255,0.05); border:2px solid rgba(139,92,246,0.3); border-radius:12px; color:#fff; outline:none; transition:0.3s; }
  .pin-input:focus { border-color:#8b5cf6; box-shadow:0 0 20px rgba(139,92,246,0.4); }
  .unlock-btn { margin-top:20px; padding:12px 45px; background:linear-gradient(135deg,#8b5cf6,#d946ef); border:none; border-radius:10px; color:#fff; font-size:16px; cursor:pointer; font-weight:600; font-family:'Cairo'; }
  .error-msg { color:#f87171; margin-top:15px; font-size:13px; height:20px; }
  .shake { animation:shake 0.4s; }
  @keyframes shake { 0%,100% { transform:translateX(0); } 25% { transform:translateX(-10px); } 75% { transform:translateX(10px); } }

  .app { width:100%; max-width:900px; background:rgba(20, 15, 35, 0.85); backdrop-filter:blur(25px); border-radius:20px; border:1px solid rgba(139,92,246,0.2); box-shadow:0 25px 60px rgba(0,0,0,0.6); display:none; flex-direction:column; height:92vh; overflow:hidden; position:relative; }
  .app.show { display:flex; }

  .header { padding:15px 20px; background:linear-gradient(90deg, rgba(139,92,246,0.15), rgba(217,70,239,0.1)); border-bottom:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center; }
  .header h1 { font-size:18px; font-weight:700; color:#f8fafc; }
  .icon-btn { background:rgba(255,255,255,0.05); border:none; color:#e2e8f0; width:36px; height:36px; border-radius:10px; cursor:pointer; font-size:15px; transition:0.3s; }
  .icon-btn:hover { background:rgba(139,92,246,0.3); }

  .tabs { display:flex; background:rgba(0,0,0,0.2); border-bottom:1px solid rgba(255,255,255,0.05); }
  .tab { flex:1; padding:12px; background:transparent; border:none; color:#94a3b8; font-family:'Cairo'; font-size:14px; font-weight:600; cursor:pointer; transition:0.3s; border-bottom:2px solid transparent; }
  .tab.active { color:#d8b4fe; border-bottom-color:#d8b4fe; background:rgba(139,92,246,0.1); }

  .content-area { flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  
  #chatPage { display:flex; flex-direction:column; height:100%; }
  #status { text-align:center; padding:8px; font-size:12px; color:#a78bfa; background:rgba(139,92,246,0.1); border-bottom:1px solid rgba(139,92,246,0.1); transition:0.3s; }
  
  #chat-box { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:15px; }
  #chat-box::-webkit-scrollbar { width:5px; }
  #chat-box::-webkit-scrollbar-thumb { background:#8b5cf6; border-radius:5px; }

  .message { max-width:85%; padding:14px 18px; border-radius:16px; line-height:1.7; font-size:14.5px; animation:slideIn 0.3s ease; word-wrap:break-word; }
  @keyframes slideIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .message.user { align-self:flex-start; background:linear-gradient(135deg,#6d28d9,#4c1d95); border-bottom-left-radius:4px; }
  .message.ai { align-self:flex-end; background:rgba(30, 27, 75, 0.8); border:1px solid rgba(139,92,246,0.3); border-bottom-right-radius:4px; }
  .message.error { align-self:center; background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.3); color:#fca5a5; font-size:13px; text-align:center;}
  .message .role { font-size:11px; opacity:0.6; margin-bottom:6px; font-weight:700; color:#c4b5fd;}

  .input-area { padding:15px 20px; background:rgba(10,10,20,0.8); border-top:1px solid rgba(255,255,255,0.05); display:flex; gap:10px; align-items:center; }
  .text-input { flex:1; padding:14px 18px; background:rgba(255,255,255,0.05); border:1px solid rgba(139,92,246,0.3); border-radius:14px; color:#fff; outline:none; font-family:'Cairo'; font-size:14px; transition:0.3s; }
  .text-input:focus { border-color:#8b5cf6; box-shadow:0 0 15px rgba(139,92,246,0.2); }
  
  .action-btn { width:48px; height:48px; border-radius:50%; border:none; cursor:pointer; font-size:20px; display:flex; justify-content:center; align-items:center; transition:0.3s; }
  .send-btn { background:linear-gradient(135deg,#8b5cf6,#d946ef); color:#fff; }
  .send-btn:hover { transform:scale(1.05); }
  .mic-btn { background:rgba(255,255,255,0.1); color:#fff; }
  .mic-btn.listening { background:#ef4444; animation:listening 1.2s infinite; }
  @keyframes listening { 0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,0.5); } 50% { box-shadow:0 0 0 15px rgba(239,68,68,0); } }

  #rulesPage { display:none; flex-direction:column; height:100%; padding:20px; overflow-y:auto; }
  .section-title { font-size:16px; color:#d8b4fe; margin-bottom:10px; font-weight:700; }
  .section-desc { font-size:13px; color:#94a3b8; margin-bottom:15px; line-height:1.6; }
  .rule-form { display:flex; gap:10px; margin-bottom:20px; }
  .rule-input { flex:1; padding:12px; background:rgba(255,255,255,0.05); border:1px solid rgba(139,92,246,0.3); border-radius:10px; color:#fff; font-family:'Cairo'; font-size:14px; outline:none; }
  .rule-input:focus { border-color:#8b5cf6; }
  .add-rule-btn { padding:0 20px; background:linear-gradient(135deg,#8b5cf6,#d946ef); border:none; border-radius:10px; color:#fff; font-family:'Cairo'; font-weight:600; cursor:pointer; transition:0.3s; }
  .rule-list { display:flex; flex-direction:column; gap:10px; }
  .rule-item { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); padding:15px; border-radius:12px; display:flex; justify-content:space-between; align-items:center; gap:15px; font-size:14px; line-height:1.5; }
  .rule-item .rule-text { flex:1; color:#e2e8f0; }
  .delete-btn { background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); color:#f87171; padding:6px 12px; border-radius:8px; cursor:pointer; font-family:'Cairo'; font-size:12px; transition:0.3s; }
  .delete-btn:hover { background:rgba(239,68,68,0.3); }
  .empty-state { text-align:center; color:#64748b; padding:30px; font-size:14px; }

  .settings-panel { position:absolute; inset:0; background:rgba(10,10,20,0.95); backdrop-filter:blur(10px); display:none; justify-content:center; align-items:center; z-index:100; padding:20px; }
  .settings-panel.show { display:flex; }
  .settings-box { background:#1a103c; padding:25px; border-radius:16px; width:100%; max-width:400px; border:1px solid rgba(139,92,246,0.3); }
  .settings-box h3 { color:#d8b4fe; margin-bottom:15px; font-size:16px;}
  .settings-box label { display:block; margin:12px 0 6px; color:#c4b5fd; font-size:13px; }
  .settings-box input { width:100%; padding:10px; background:rgba(0,0,0,0.3); border:1px solid rgba(139,92,246,0.3); border-radius:8px; color:#fff; outline:none; font-family:'Cairo'; font-size:13px; }
  .settings-box input:focus { border-color:#8b5cf6; }
  .btn-save { width:100%; padding:12px; margin-top:20px; background:linear-gradient(135deg,#8b5cf6,#d946ef); border:none; border-radius:8px; color:#fff; font-family:'Cairo'; font-weight:600; cursor:pointer; }

  .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:linear-gradient(135deg,#8b5cf6,#d946ef); padding:12px 24px; border-radius:10px; color:#fff; font-weight:600; font-size:13px; z-index:10000; transition:0.4s; opacity:0; font-family:'Cairo'; }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }

  @media (max-width:600px) { .app { height:100vh; border-radius:0; border:none; } .message { max-width:92%; font-size:13.5px; } }
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-icon">🔒</div>
  <h2>أدخل الرقم السري للمتابعة</h2>
  <input type="password" class="pin-input" id="pinInput" maxlength="5" placeholder="•••••" inputmode="numeric">
  <button class="unlock-btn" onclick="unlock()">دخول</button>
  <div class="error-msg" id="errorMsg"></div>
</div>

<div class="app" id="app">
  <div class="header">
    <h1>📖 المساعد القصصي</h1>
    <div class="header-btns">
      <button class="icon-btn" onclick="openSettings()" title="الإعدادات">⚙️</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('chat')">💬 السيناريو</button>
    <button class="tab" onclick="switchTab('rules')">📜 المعلومات الرئيسية</button>
  </div>

  <div class="content-area">
    <div id="chatPage">
      <div id="status">اضغط الميكروفون أو اكتب في الأسفل...</div>
      <div id="chat-box"></div>
      <div class="input-area">
        <input type="text" id="textInput" class="text-input" placeholder="اكتب رسالتك..." onkeypress="if(event.key==='Enter') sendText()">
        <button class="action-btn send-btn" onclick="sendText()" title="إرسال">➤</button>
        <button class="action-btn mic-btn" id="micBtn" onclick="toggleMic()" title="تحدث">🎤</button>
      </div>
    </div>

    <div id="rulesPage">
      <div class="section-title">📜 قواعد وحدود السيناريو</div>
      <div class="section-desc">هنا تحط المعلومات الأساسية والحدود اللي المساعد لازم يلتزم بيها.</div>
      <div class="rule-form">
        <input type="text" id="ruleInput" class="rule-input" placeholder="أضف قاعدة..." onkeypress="if(event.key==='Enter') addRule()">
        <button class="add-rule-btn" onclick="addRule()">إضافة</button>
      </div>
      <div class="rule-list" id="ruleList"></div>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-box">
      <h3>⚙️ الإعدادات</h3>
      <label>مفتاح Gemini API:</label>
      <input type="password" id="apiKeyInput" placeholder="الصق المفتاح هنا...">
      <button class="btn-save" onclick="saveSettings()">حفظ وإغلاق</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SECRET_PIN = "77777";
const chatBox = document.getElementById('chat-box');
const statusDiv = document.getElementById('status');
const micBtn = document.getElementById('micBtn');
const textInput = document.getElementById('textInput');
const ruleList = document.getElementById('ruleList');

let isListening = false;
let chatHistory = JSON.parse(localStorage.getItem('story_chat') || '[]');
let userRules = JSON.parse(localStorage.getItem('story_rules') || '[]');
let apiKey = localStorage.getItem('gemini_api_key') || '';

window.unlock = function() {
  const input = document.getElementById('pinInput');
  const err = document.getElementById('errorMsg');
  if (input.value === SECRET_PIN) {
    document.getElementById('lockScreen').classList.add('hidden');
    document.getElementById('app').classList.add('show');
    initApp();
  } else {
    let attempts = parseInt(input.dataset.attempts || 0) + 1;
    input.dataset.attempts = attempts;
    err.textContent = `❌ رقم خاطئ (${attempts})`;
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 400);
    input.value = '';
  }
};
document.getElementById('pinInput').addEventListener('keypress', e => { if (e.key === 'Enter') window.unlock(); });

function initApp() {
  chatHistory.forEach(msg => renderMessage(msg.role, msg.text));
  renderRules();
  if (apiKey) {
    setStatus('✅ النظام جاهز. ابدأ السيناريو...');
  } else {
    setStatus('⚠️ الرجاء إدخال مفتاح API من الإعدادات');
    openSettings();
  }
}

window.switchTab = function(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('#chatPage, #rulesPage').forEach(p => p.style.display = 'none');
  if (tab === 'chat') {
    document.querySelector('.tabs .tab:nth-child(1)').classList.add('active');
    document.getElementById('chatPage').style.display = 'flex';
  } else {
    document.querySelector('.tabs .tab:nth-child(2)').classList.add('active');
    document.getElementById('rulesPage').style.display = 'flex';
  }
};

window.openSettings = function() {
  document.getElementById('apiKeyInput').value = apiKey;
  document.getElementById('settingsPanel').classList.add('show');
};
window.saveSettings = function() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (key) {
    apiKey = key;
    localStorage.setItem('gemini_api_key', key);
    setStatus('✅ تم حفظ المفتاح.');
    document.getElementById('settingsPanel').classList.remove('show');
  } else {
    showToast('⚠️ أدخل مفتاح صالح');
  }
};

window.addRule = function() {
  const input = document.getElementById('ruleInput');
  const text = input.value.trim();
  if (!text) return;
  userRules.push(text);
  localStorage.setItem('story_rules', JSON.stringify(userRules));
  input.value = '';
  renderRules();
};
window.deleteRule = function(index) {
  userRules.splice(index, 1);
  localStorage.setItem('story_rules', JSON.stringify(userRules));
  renderRules();
};
function renderRules() {
  if (userRules.length === 0) {
    ruleList.innerHTML = '<div class="empty-state">لا توجد قواعد بعد.</div>';
    return;
  }
  ruleList.innerHTML = userRules.map((rule, i) => `
    <div class="rule-item">
      <div class="rule-text">${escapeHtml(rule)}</div>
      <button class="delete-btn" onclick="deleteRule(${i})">🗑️</button>
    </div>
  `).join('');
}

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'ar-EG';
  recognition.interimResults = false;
  recognition.onstart = () => { isListening = true; micBtn.classList.add('listening'); setStatus('🎤 جاري الاستماع...'); };
  recognition.onresult = (e) => handleUserInput(e.results[0][0].transcript);
  recognition.onerror = (e) => { setStatus('❌ خطأ: ' + e.error); isListening = false; micBtn.classList.remove('listening'); };
  recognition.onend = () => { isListening = false; micBtn.classList.remove('listening'); };
}
window.toggleMic = function() {
  if (!apiKey) { showToast('⚠️ أدخل مفتاح API أولاً'); openSettings(); return; }
  if (!recognition) { showToast('❌ المتصفح لا يدعم الصوت'); return; }
  if (isListening) recognition.stop();
  else { if (window.speechSynthesis) window.speechSynthesis.cancel(); recognition.start(); }
};

window.sendText = function() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  handleUserInput(text);
};

// *** الدالة دي اتغيرت عشان تستخدم الاتصال المباشر بدون مكتبات ***
async function handleUserInput(text) {
  if (!apiKey) { showToast('⚠️ أدخل مفتاح API أولاً'); return; }
  
  renderMessage('user', text);
  chatHistory.push({ role:'user', text });
  saveHistory();
  setStatus('✍️ جاري التفكير...');

  try {
    const rulesContext = userRules.length > 0 
      ? `إليك القواعد الأساسية والمعلومات التي يجب أن تلتزم بها حرفياً:\n- ${userRules.join('\n- ')}` 
      : 'لا توجد قواعد محددة.';

    const recentHistory = chatHistory.slice(-6, -1)
      .map(h => `${h.role === 'user' ? 'المستخدم' : 'الراوي'}: ${h.text}`)
      .join('\n');

    const prompt = `أنت محرك سيناريوهات قصصي (Story Engine).\n${rulesContext}\n${recentHistory ? 'سياق الأحداث:\n' + recentHistory + '\n' : ''}\nالمستخدم يقول: "${text}"\nاكتب الرد بصيغة درامية قصصية، والتزم بالقواعد.`;

    // رابط الاتصال المباشر بـ Gemini
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;
    
    const response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();

    // لو فيه خطأ من السيرفر هنعرضه في الشات
    if (data.error) {
      throw new Error(data.error.message || 'خطأ من السيرفر');
    }

    // استخراج الرد
    const aiText = data.candidates[0].content.parts[0].text;

    renderMessage('ai', aiText);
    chatHistory.push({ role:'ai', text:aiText });
    saveHistory();
    speak(aiText);

  } catch (err) {
    console.error("التفاصيل:", err);
    // عرض الخطأ الحقيقي في الشات عشان نعرف السبب
    renderMessage('error', '❌ سبب المشكلة: ' + err.message);
    setStatus('❌ فشل الاتصال. راجع الخطأ بالأحمر.');
  }
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'ar-SA';
  utt.rate = 0.95;
  utt.onstart = () => setStatus('🔊 يروي...');
  utt.onend = () => setStatus('✅ جاهز');
  window.speechSynthesis.speak(utt);
}

function renderMessage(role, text) {
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const roleName = role === 'user' ? '🧑 أنت' : (role === 'error' ? '⚠️ نظام' : '📖 الراوي');
  div.innerHTML = `<div class="role">${roleName}</div>${escapeHtml(text).replace(/\n/g, '<br>')}`;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function saveHistory() {
  if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50);
  localStorage.setItem('story_chat', JSON.stringify(chatHistory));
}

function setStatus(txt) { statusDiv.textContent = txt; }
function escapeHtml(str) { return String(str).replace(/[&<>"']/g, s => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[s])); }
function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
</script>
</body>
</html>
